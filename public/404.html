  <title>Interviewly — Redirecting...</title>
  <script>
    // Failsafe client-side routing fallback for Cloudflare Pages
    const path = window.location.pathname;
    window.location.replace('/' + (path.startsWith('/') ? path.slice(1) : path));
  </script>
</head>
